server:
  port: 8083


eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8761/eureka/

spring:
  datasource:
        url: jdbc:mysql://localhost:3306/dborder
        username: root
        password: 12345678q
        driver-class-name: com.mysql.jdbc.Driver
        hikari:
            minimumIdle: 2
            maximumPoolSize: 5
            cachePrepStmts: true
            prepStmtsCacheSize: 250
            prepStmtsCacheSqlLimit: 2048
            useServerPrepStmts: true
  jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties: 
            hibernate: 
              format-sql: true
management:
  tracing:
    sampling:
        probability: 1.0
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: ALWAYS
  health:
    circuitbreakers:
      enabled: true

resilience4j.circuitbreaker:
  configs: 
    default:
      registerHealthIndicator: true
      slidingWindowSize: 10
      minimumNumberOfCalls: 5
      permittedNumberOfCallsInHalfOpenState: 3
      automaticTransitionFromOpenToHalfopenEnabled: true
      waitDurationInOpenState: 10s
      failureRateThreshold: 50
      eventConsumerBufferSize: 10
