server:
    port: 8082

eureka:
    client:
        serviceUrl:
            defaultZone: http://localhost:8761/eureka/

spring:
    datasource:
        url: jdbc:mysql://localhost:3306/dbproduct
        username: root
        password: 12345678q
        driver-class-name: com.mysql.jdbc.Driver
        hikari:
            minimumIdle: 2
            maximumPoolSize: 5
            cachePrepStmts: true
            prepStmtsCacheSize: 250
            prepStmtsCacheSqlLimit: 2048
            useServerPrepStmts: true
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties: 
            hibernate: 
              format-sql: true

management:
  tracing:
    sampling:
        probability: 1.0
  endpoints:
    web:
      exposure:
        include: "*"