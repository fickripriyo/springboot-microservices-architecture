server:
  port: 8081

spring:
  application:
    name: customer-service
  datasource:
    url: jdbc:mysql://mysql-customer:3306/dbcustomer
    username: customeruser
    password: customerpass
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  zipkin:
    base-url: http://zipkin:9411

management:
  tracing:
    sampling:
      probability: 1.0
    exporter:
      zipkin:
        enabled: true 

eureka:
  client:
    serviceUrl:
      defaultZone: http://registry-service:8761/eureka/
