services:
  mysql-auth:
    image: mysql:8.0
    container_name: mysql-auth
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_AUTH_DB}
      MYSQL_USER: ${MYSQL_AUTH_USER}
      MYSQL_PASSWORD: ${MYSQL_AUTH_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_AUTH_PORT}:3306"
    volumes:
      - mysql-auth-data:/var/lib/mysql
    networks:
      - microservices-net

  mysql-order:
    image: mysql:8.0
    container_name: mysql-order
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_ORDER_DB}
      MYSQL_USER: ${MYSQL_ORDER_USER}
      MYSQL_PASSWORD: ${MYSQL_ORDER_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_ORDER_PORT}:3306"
    volumes:
      - mysql-order-data:/var/lib/mysql
    networks:
      - microservices-net

  mysql-product:
    image: mysql:8.0
    container_name: mysql-product
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_PRODUCT_DB}
      MYSQL_USER: ${MYSQL_PRODUCT_USER}
      MYSQL_PASSWORD: ${MYSQL_PRODUCT_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_PRODUCT_PORT}:3306"
    volumes:
      - mysql-product-data:/var/lib/mysql
    networks:
      - microservices-net

  mysql-customer:
    image: mysql:8.0
    container_name: mysql-customer
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_CUSTOMER_DB}
      MYSQL_USER: ${MYSQL_CUSTOMER_USER}
      MYSQL_PASSWORD: ${MYSQL_CUSTOMER_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    ports:
      - "${MYSQL_CUSTOMER_PORT}:3306"
    volumes:
      - mysql-customer-data:/var/lib/mysql
    networks:
      - microservices-net

  registry-service:
    build:
      context: ./registry-service
    image: registry-service
    container_name: registry-service
    restart: unless-stopped
    ports:
      - "${REGISTRY_SERVICE_PORT}:8761"
    networks:
      - microservices-net

  auth-service:
    build:
      context: ./auth-service
    image: auth-service
    container_name: auth-service
    restart: unless-stopped
    depends_on:
      - mysql-auth
      - registry-service
   
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql-auth:3306/${MYSQL_AUTH_DB}
      SPRING_DATASOURCE_USERNAME: ${MYSQL_AUTH_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_AUTH_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:${REGISTRY_SERVICE_PORT}/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION}
    networks:
      - microservices-net

  api-gateway:
    build:
      context: ./api-gateway
    image: api-gateway
    container_name: api-gateway
    restart: unless-stopped
    depends_on:
      - registry-service
      - auth-service
    ports:
      - "${API_GATEWAY_PORT}:80"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:${REGISTRY_SERVICE_PORT}/eureka/
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - microservices-net


  order-service:
    build:
      context: ./order-service
    image: order-service
    container_name: order-service
    restart: unless-stopped
    depends_on:
      - registry-service
      - config-server
    ports:
      - "${ORDER_SERVICE_PORT}:8083"
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:${CONFIG_SERVER_PORT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:${REGISTRY_SERVICE_PORT}/eureka/
    networks:
      - microservices-net


  product-service:
    build:
      context: ./product-service
    image: product-service
    container_name: product-service
    restart: unless-stopped
    depends_on:
      - mysql-product
      - registry-service
      - config-server
    ports:
      - "${PRODUCT_SERVICE_PORT}:8082"
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:${CONFIG_SERVER_PORT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:${REGISTRY_SERVICE_PORT}/eureka/
    networks:
      - microservices-net


  customer-service:
    build:
      context: ./customer-service
    image: customer-service
    container_name: customer-service
    restart: unless-stopped
    depends_on:
      - mysql-customer
      - registry-service
      - config-server
    ports:
      - "${CUSTOMER_SERVICE_PORT}:8081"
    environment:
      SPRING_CONFIG_IMPORT: configserver:http://config-server:${CONFIG_SERVER_PORT}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:${REGISTRY_SERVICE_PORT}/eureka/
    networks:
      - microservices-net


  config-server:
    build:
      context: ./config-server
    image: config-server
    container_name: config-server
    restart: unless-stopped
    depends_on:
      - registry-service
    ports:
      - "${CONFIG_SERVER_PORT}:8088"
    environment:
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://registry-service:${REGISTRY_SERVICE_PORT}/eureka/
    networks:
      - microservices-net


  zipkin:
    image: openzipkin/zipkin:2.24
    container_name: zipkin
    ports:
      - "${ZIPKIN_PORT}:9411"
    environment:
      STORAGE_TYPE: mem
    networks:
      - microservices-net


volumes:
  mysql-auth-data:
  mysql-order-data:
  mysql-product-data:
  mysql-customer-data:

networks:
  microservices-net:
    driver: bridge
