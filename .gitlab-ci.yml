stages:
  - build
  - deploy

variables:
  IMAGE_NAME: registry.gitlab.com/fickofickri/springboot-microservices-architecture/auth-service
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# ======================
# BUILD & PUSH IMAGE
# ======================
build-auth:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind

  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

  script:
    # build image
    - docker build -t $IMAGE_NAME:$CI_COMMIT_SHORT_SHA ./auth-service

    # tag
    - docker tag $IMAGE_NAME:$CI_COMMIT_SHORT_SHA $IMAGE_NAME:latest

    # push
    - docker push $IMAGE_NAME:$CI_COMMIT_SHORT_SHA
    - docker push $IMAGE_NAME:latest

  only:
    - main

# ======================
# DEPLOY
# ======================
deploy:
  stage: deploy
  image: alpine:latest

  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts

  script:
    - ssh $VPS_USER@$VPS_HOST "
        cd /root &&
        if [ ! -d 'app' ]; then
          git clone git@gitlab.com:fickofickri/springboot-microservices-architecture.git app;
        fi &&
        cd app &&
        git pull origin main &&

        docker compose pull &&
        docker compose down || true &&
        docker compose up -d
      "

  only:
    - main