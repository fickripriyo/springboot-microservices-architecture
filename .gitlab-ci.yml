stages:
  - build
  - deploy

variables:
  DOCKER_HOST: tcp://docker:2375
  DOCKER_TLS_CERTDIR: ""

# ======================
# BUILD
# ======================
.build-template:
  stage: build
  image: docker:24.0.5
  services:
    - docker:24.0.5-dind
  before_script:
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY

# ======================
# DEPLOY
# ======================
.deploy-template:
  stage: deploy
  image: alpine:latest
  before_script:
    - apk add --no-cache openssh-client
    - mkdir -p ~/.ssh
    - echo "$SSH_PRIVATE_KEY" | base64 -d > ~/.ssh/id_ed25519
    - chmod 600 ~/.ssh/id_ed25519
    - ssh-keyscan -H $VPS_HOST >> ~/.ssh/known_hosts

# ======================
# AUTH SERVICE
# ======================
build-auth:
  extends: .build-template
  script:
    - docker build -t $CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHORT_SHA ./auth-service
    - docker tag $CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHORT_SHA $CI_REGISTRY_IMAGE/auth-service:latest
    - docker push $CI_REGISTRY_IMAGE/auth-service:$CI_COMMIT_SHORT_SHA
    - docker push $CI_REGISTRY_IMAGE/auth-service:latest
  rules:
    - changes:
        - auth-service/**

deploy-auth:
  extends: .deploy-template
  script:
    - ssh $VPS_USER@$VPS_HOST "
        cd /root/app &&
        docker compose pull auth-service &&
        docker compose up -d auth-service
      "
  rules:
    - changes:
        - auth-service/**

